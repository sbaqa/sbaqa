<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Measured results across my projects">
<style>
  .t{font:700 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}
  .v{font:800 30px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}
  .l{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}
  .s{font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
  .bg{fill:none;stroke:#d0d7de;stroke-opacity:.45}
  .ring{fill:none;stroke-linecap:round;animation:fill 1.6s cubic-bezier(.2,.8,.2,1) both}
  .fade{animation:fade .8s ease both}
  @keyframes fill{from{stroke-dashoffset:389.56}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media (prefers-color-scheme:dark){.t,.v,.l{fill:#e6edf3}.s{fill:#8b949e}.bg{stroke:#30363d;stroke-opacity:1}}
</style>
<text class="t" x="480.0" y="34" text-anchor="middle">Measured results across my projects</text>
<defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#FF6B6B" stop-opacity=".65"/></linearGradient></defs>
<circle class="bg" cx="160.0" cy="130" r="62" stroke-width="16"/>
<circle class="ring" cx="160.0" cy="130" r="62" stroke="url(#g0)" stroke-width="16" stroke-dasharray="389.56" stroke-dashoffset="109.08" transform="rotate(-90 160.0 130)" style="animation-delay:0.00s"/>
<text class="v fade" x="160.0" y="140" text-anchor="middle" style="animation-delay:0.60s">72%</text>
<text class="l" x="160.0" y="222" text-anchor="middle">Manual testing time</text>
<text class="s" x="160.0" y="241" text-anchor="middle">reduced</text>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA94D"/><stop offset="1" stop-color="#FFA94D" stop-opacity=".65"/></linearGradient></defs>
<circle class="bg" cx="480.0" cy="130" r="62" stroke-width="16"/>
<circle class="ring" cx="480.0" cy="130" r="62" stroke="url(#g1)" stroke-width="16" stroke-dasharray="389.56" stroke-dashoffset="155.82" transform="rotate(-90 480.0 130)" style="animation-delay:0.15s"/>
<text class="v fade" x="480.0" y="140" text-anchor="middle" style="animation-delay:0.75s">60%</text>
<text class="l" x="480.0" y="222" text-anchor="middle">Regression cycle</text>
<text class="s" x="480.0" y="241" text-anchor="middle">shorter</text>
<defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCC419"/><stop offset="1" stop-color="#FCC419" stop-opacity=".65"/></linearGradient></defs>
<circle class="bg" cx="800.0" cy="130" r="62" stroke-width="16"/>
<circle class="ring" cx="800.0" cy="130" r="62" stroke="url(#g2)" stroke-width="16" stroke-dasharray="389.56" stroke-dashoffset="155.82" transform="rotate(-90 800.0 130)" style="animation-delay:0.30s"/>
<text class="v fade" x="800.0" y="140" text-anchor="middle" style="animation-delay:0.90s">60%</text>
<text class="l" x="800.0" y="222" text-anchor="middle">Production issues</text>
<text class="s" x="800.0" y="241" text-anchor="middle">fewer</text>
<defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#51CF66"/><stop offset="1" stop-color="#51CF66" stop-opacity=".65"/></linearGradient></defs>
<circle class="bg" cx="160.0" cy="335" r="62" stroke-width="16"/>
<circle class="ring" cx="160.0" cy="335" r="62" stroke="url(#g3)" stroke-width="16" stroke-dasharray="389.56" stroke-dashoffset="233.73" transform="rotate(-90 160.0 335)" style="animation-delay:0.45s"/>
<text class="v fade" x="160.0" y="345" text-anchor="middle" style="animation-delay:1.05s">40%</text>
<text class="l" x="160.0" y="427" text-anchor="middle">Test coverage</text>
