<defs><linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CC5DE8"/><stop offset="1" stop-color="#CC5DE8" stop-opacity=".65"/></linearGradient></defs>
<circle class="bg" cx="800.0" cy="335" r="62" stroke-width="16"/>
<circle class="ring" cx="800.0" cy="335" r="62" stroke="url(#g5)" stroke-width="16" stroke-dasharray="389.56" stroke-dashoffset="331.12" transform="rotate(-90 800.0 335)" style="animation-delay:0.75s"/>
<text class="v fade" x="800.0" y="345" text-anchor="middle" style="animation-delay:1.35s">15%</text>
<text class="l" x="800.0" y="427" text-anchor="middle">Team velocity</text>
<text class="s" x="800.0" y="446" text-anchor="middle">faster</text>
