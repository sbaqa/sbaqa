<circle class="bg" cx="480.0" cy="335" r="62" stroke-width="16"/>
<circle class="ring" cx="480.0" cy="335" r="62" stroke="url(#g4)" stroke-width="16" stroke-dasharray="389.56" stroke-dashoffset="233.73" transform="rotate(-90 480.0 335)" style="animation-delay:0.60s"/>
<text class="v fade" x="480.0" y="345" text-anchor="middle" style="animation-delay:1.20s">40%</text>
<text class="l" x="480.0" y="427" text-anchor="middle">Bugs</text>
